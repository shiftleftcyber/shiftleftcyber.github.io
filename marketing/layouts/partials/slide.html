{{ with .Site.Data.hero }}
<section class="relative overflow-hidden bg-gray-900 text-white">
    <img class="absolute inset-0 h-full w-full object-cover opacity-30" src="{{ .image | relURL }}" alt="{{ .alt }}">
    <div class="absolute inset-0 bg-gray-900 opacity-70"></div>
    <div class="relative mx-auto max-w-7xl px-4 py-12 md:py-16">
        <div class="max-w-4xl">
            <p class="uppercase tracking-wide text-sm text-blue-200 font-semibold">{{ .eyebrow }}</p>
            <h1 class="text-4xl md:text-5xl mt-3 mb-4">{{ .title }}</h1>
            <p class="sans text-xl text-gray-100 max-w-3xl mb-6">{{ .description }}</p>
            <div class="flex flex-wrap gap-3">
                <a class="inline-block bg-blue-600 text-white px-5 py-3 rounded hover:bg-blue-700 duration-200" href="{{ .primary_link }}"{{ if .primary_external }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .primary_label }}</a>
                <a class="inline-block border border-white text-white px-5 py-3 rounded hover:bg-white hover:text-gray-900 duration-200" href="{{ .secondary_link }}"{{ if .secondary_external }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .secondary_label }}</a>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-10">
            {{ range .proof_points }}
            <div class="border border-gray-600 bg-gray-800 bg-opacity-80 p-5">
                <h2 class="text-xl mb-2">{{ .title }}</h2>
                <p class="sans text-gray-200 mb-0">{{ .description }}</p>
            </div>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
