<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "ShiftLeftCyber",
  "url": "{{ .Site.BaseURL }}",
  "sameAs": [
    "https://github.com/shiftleftcyber"
  ]
}
</script>
{{ if eq .RelPermalink "/securesbom/" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "SecureSBOM",
  "applicationCategory": "SecurityApplication",
  "operatingSystem": "Web, API, CI/CD",
  "description": "SBOM signing and verification platform for software supply chain security.",
  "url": "{{ .Permalink }}",
  "offers": {
    "@type": "Offer",
    "url": "https://app.securesbom.com/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "ShiftLeftCyber",
    "url": "{{ .Site.BaseURL }}"
  }
}
</script>
{{ end }}
{{ if eq .RelPermalink "/attestations/" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": {{ .Title }},
  "description": {{ .Description }},
  "url": "{{ .Permalink }}",
  "datePublished": "{{ .Date.Format "2006-01-02" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
  {{- with .Params.image }}
  "image": "{{ . | absURL }}",
  {{- end }}
  "keywords": {{ delimit .Keywords ", " }},
  "proficiencyLevel": "Beginner",
  "about": [
    { "@type": "Thing", "name": "SBOM attestation" },
    { "@type": "SoftwareApplication", "name": "SecureSBOM", "url": "{{ "securesbom/" | absURL }}" }
  ],
  "author": { "@type": "Organization", "name": "ShiftLeftCyber", "url": "{{ .Site.BaseURL }}" },
  "publisher": { "@type": "Organization", "name": "ShiftLeftCyber", "url": "{{ .Site.BaseURL }}" }
}
</script>
{{ end }}
