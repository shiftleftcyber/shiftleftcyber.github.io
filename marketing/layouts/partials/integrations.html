<section class="bg-white border-t border-b border-gray-200 py-6 md:py-8">
    <div class="mx-auto max-w-6xl px-4">
        <div class="flex flex-col lg:flex-row lg:items-center gap-6 lg:gap-10">
            <div class="lg:w-72 flex-shrink-0">
                <p class="sans text-sm text-blue-600 font-semibold mb-1">Partner ecosystem</p>
                <h2 class="text-2xl md:text-3xl mb-2">Works with the tools teams already use</h2>
                <p class="sans text-gray-700 mb-0">Integrations and standards support for practical SBOM and AI-BOM workflows.</p>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 flex-1">
                {{ range .Site.Data.integrations }}
                <a href="{{ .link }}" target="_blank" rel="noopener noreferrer" title="{{ .name }}" class="group flex h-14 items-center justify-center rounded border border-gray-200 bg-gray-50 px-4 py-3 hover:bg-white hover:shadow-md duration-200">
                    <img src="{{ .img | relURL }}"
                         alt="{{ .name }}"
                         class="max-h-8 max-w-full object-contain opacity-80 group-hover:opacity-100 duration-200"
                         loading="lazy">
                </a>
                {{ end }}
            </div>
        </div>
    </div>
</section>
