<div id="contact-request" class="contact-request not-prose" hidden>
  <p><strong id="contact-request-title"></strong></p>
  <p>Please include this in the message field below so we know what you need:</p>
  <div id="contact-request-msg" class="contact-request-msg"></div>
  <button type="button" id="contact-request-copy">Copy message</button>
</div>
<script>
  (function () {
    // Known request types only: the banner never echoes arbitrary text from the URL.
    // The `message` query parameter is left in place so HubSpot can prefill its message field.
    var REQUESTS = {
      "attestation-guide": {
        title: "Requesting the Attestations Reference Guide (PDF)",
        message: "Hi, please send me the PDF copy of the SecureSBOM Attestations Reference Guide (sign and verify request/response checklist)."
      },
      "demo": {
        title: "Requesting a SecureSBOM demo",
        message: "Hi, I'd like to request a SecureSBOM demo."
      }
    };
    var type = new URLSearchParams(window.location.search).get("type");
    var req = type && Object.prototype.hasOwnProperty.call(REQUESTS, type) ? REQUESTS[type] : null;
    if (!req) return;
    var box = document.getElementById("contact-request");
    document.getElementById("contact-request-title").textContent = req.title;
    document.getElementById("contact-request-msg").textContent = req.message;
    box.hidden = false;
    var btn = document.getElementById("contact-request-copy");
    btn.addEventListener("click", function () {
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(req.message).then(function () {
        btn.textContent = "Copied";
        setTimeout(function () { btn.textContent = "Copy message"; }, 2000);
      });
    });
  })();
</script>
