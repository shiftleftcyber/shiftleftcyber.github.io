baseURL = "https://shiftleftcyber.io"
title = "ShiftLeftCyber"
author = "ShiftLeftCyber"
languageCode = "en"
DefaultContentLanguage = "en"
enableInlineShortcodes = true
theme = "tella"
enableRobotsTXT = true

# Please enable this feature if the site is available in Japanese, Chinese or Korean.
#hasCJKLanguage = true

# If you're using Google Analytics, you can enable this feature.
googleAnalytics = "G-CR0HB4HF2K"

# Disqus Comment System
#disqusShortname = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]

  showBlog = true
  mainSections = ['blog']
  description = "ShiftLeftCyber builds SBOM, AI-BOM, and software supply chain security tools for signing, verification, compliance, and audit-ready transparency."

  googleFonts = true

  [params.logo]
    main = "img/logos/ShiftLeftCyberMainLogoUpdated.png"
    alt = "SBOM management solutions by ShiftLeftCyber"

    # The size parameter is the class name of tailwindcss
    # https://tailwindcss.com/
    size = "h-14"

  [params.site]
    name = "Supply Chain Security"

  [params.icon]
    #If you want to use FontAwesome, set this parameter to true.
    fontawesome = true

  [params.homepage_meta_tags]
    meta_description = "ShiftLeftCyber builds SBOM, AI-BOM, and software supply chain security tools for signing, verification, compliance, and audit-ready transparency."
    meta_og_title = "ShiftLeftCyber | SBOM, AI-BOM, and Software Supply Chain Security"
    meta_og_type = "website"
    meta_og_url = "https://shiftleftcyber.io"
    meta_og_image = "https://shiftleftcyber.io/img/high-res/metaimage.jpg"
    meta_og_description = "SecureSBOM helps teams sign and verify SBOMs, while AI-BOM documents AI software supply chains with structured, machine-readable metadata."
    meta_og_author = "ShiftLeftCyber"
    meta_og_keywords = "SBOM, AI-BOM, SecureSBOM, SBOM signing, SBOM verification, software supply chain security, CISA SBOM minimum elements, NTIA SBOM, CycloneDX, SPDX, author signature, AI supply chain, software bill of materials"

[menu]

  [[menu.main]]
    identifier = "securesbom"
    name = "SecureSBOM"
    url = "/securesbom/"
    weight = 1

  [[menu.main]]
    identifier = "ai-bom"
    name = "AI-BOM"
    url = "/ai-bom/"
    weight = 2

  [[menu.main]]
    identifier = "faq"
    name = "FAQ"
    url = "/faq/"
    weight = 3

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 5

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 6

  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contactus/"
    weight = 7

  [[menu.main]]
    identifier = "portal"
    name = "Portal"
    url = "https://app.securesbom.com/"
    weight = 8
    [menu.main.params]
      button = true
      external = true

  # Footer Menu
  [[menu.footer]]
    name = "Home"
    url = "/"
      weight = 1

  [[menu.footer]]
    name = "Github"
    url = "https://github.com/shiftleftcyber/"
    pre = "<i class='icon-github text-2xl'></i>"
      weight = 2
